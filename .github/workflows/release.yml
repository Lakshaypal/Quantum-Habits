name: Release

# Tag a version in THIS (private) repo (git tag v2.1.0 && git push --tags):
# each job builds a platform artifact and publishes it to the PUBLIC
# binaries-only repo (Lakshaypal/quantum-habits-releases), which the in-app
# updater polls. Shipping an update to every installed device = one tag.
#
# Requires a repo secret RELEASE_TOKEN: any GitHub token that can write to
# the public releases repo (Settings → Secrets → Actions).
on:
  push:
    tags: ['v*']

env:
  RELEASE_REPO: Lakshaypal/quantum-habits-releases

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --no-tree-shake-icons
      - run: mv build/app/outputs/flutter-apk/app-release.apk QuantumHabits-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: QuantumHabits-android, path: QuantumHabits-android.apk }
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: QuantumHabits-android.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter build macos --release --no-tree-shake-icons
      - run: |
          cd "build/macos/Build/Products/Release"
          ditto -c -k --sequesterRsrc --keepParent "quantum_habits.app" "$GITHUB_WORKSPACE/QuantumHabits-macos.zip"
      - uses: actions/upload-artifact@v4
        with: { name: QuantumHabits-macos, path: QuantumHabits-macos.zip }
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: QuantumHabits-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter build windows --release --no-tree-shake-icons
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath QuantumHabits-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: QuantumHabits-windows, path: QuantumHabits-windows.zip }
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: QuantumHabits-windows.zip

name: Release

# Tag a version (git tag v2.1.0 && git push --tags) and this builds the
# macOS, Windows and Android artifacts and attaches them to a GitHub Release.
# The in-app updater (lib/features/updates/update_service.dart) reads that
# release, so shipping an update to every installed device = pushing one tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --no-tree-shake-icons
      - run: mv build/app/outputs/flutter-apk/app-release.apk QuantumHabits-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: QuantumHabits-android.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter build macos --release --no-tree-shake-icons
      - run: |
          cd "build/macos/Build/Products/Release"
          ditto -c -k --sequesterRsrc --keepParent "Quantum Habits.app" "$GITHUB_WORKSPACE/QuantumHabits-macos.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: QuantumHabits-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter build windows --release --no-tree-shake-icons
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath QuantumHabits-windows.zip
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: QuantumHabits-windows.zip
